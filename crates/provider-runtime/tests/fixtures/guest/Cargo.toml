[package]
name = "stream-provider-fixture-component"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
members = ["implementation"]

[lib]
crate-type = ["cdylib"]

[dependencies]
stream-provider-fixture-implementation = { path = "implementation" }
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
