[package]
name = "stream-provider-fixture-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
stream-provider-sdk = { path = "../../.." }
wit-bindgen = { version = "0.63.0", default-features = false, features = ["macros", "realloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
