;
;  supervisord.ini
;  Stream TV Deployment
;
;  Created by ChrisRodStar.
;
;  Summary:
;  Process supervisor configuration for the streaming container. Manages the lifecycle,
;  restart policies, and privilege boundaries for providers and relay workers.
;

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisor/supervisord.pid
loglevel=warn

[unix_http_server]
file=/run/supervisor/control.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/control.sock

[program:providers]
command=/usr/bin/setpriv --reuid=1000 --regid=1000 --clear-groups --inh-caps=-all,+net_raw --ambient-caps=-all,+net_raw --bounding-set=-all,+net_raw --no-new-privs /opt/releases/providers/current/providers /run/secrets/providers.json
user=root
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopwaitsecs=45
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay]
command=/usr/bin/setpriv --reuid=1000 --regid=1000 --clear-groups --inh-caps=-all,+net_raw --ambient-caps=-all,+net_raw --bounding-set=-all,+net_raw --no-new-privs /opt/releases/relay/current/stv-relay /run/secrets/relay.toml
user=root
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
