name: Rust workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check production and test code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install ffmpeg (end-to-end playback tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Rust contracts and unit tests
        run: cargo test --workspace --locked
      - name: Docker image builds
        run: docker build --tag mello-jellyfin:ci .
