<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <style>
    .title-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .item-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #8b949e; }
  </style>

  <!-- Main Container -->
  <rect width="800" height="170" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2"/>

  <g transform="translate(32, 24)">
    <circle cx="5" cy="5" r="4" fill="#3fb950"/>
    <text x="18" y="9" class="title-label" fill="#3fb950">Supported Now</text>
  </g>

  <g transform="translate(32, 50)">
    <rect width="336" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="25" class="item-name">macOS</text>
    <text x="76" y="25" class="item-desc">Menu bar app (Apple Silicon)</text>
  </g>

  <g transform="translate(432, 50)">
    <rect width="336" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="25" class="item-name">iOS</text>
    <text x="50" y="25" class="item-desc">Native SwiftUI companion app</text>
  </g>

  <g transform="translate(32, 104)">
    <rect width="336" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="25" class="item-name">Web</text>
    <text x="56" y="25" class="item-desc">Any browser on your local network</text>
  </g>

  <g transform="translate(432, 104)">
    <rect width="336" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
    <text x="12" y="25" class="item-name">Docker</text>
    <text x="76" y="25" class="item-desc">Windows, Linux &amp; macOS hosts</text>
  </g>
</svg>
