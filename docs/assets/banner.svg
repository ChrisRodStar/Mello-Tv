<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Mello TV</title>
  <desc id="description">Movies and TV on your own server. Available for macOS, iOS, web, and Docker.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111112"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.13" cy="0.5" r="0.65">
      <stop stop-color="#d8c6a3" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#d8c6a3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="icon"><rect x="72" y="76" width="168" height="168" rx="38"/></clipPath>
    <clipPath id="canvas"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <image x="72" y="76" width="168" height="168" clip-path="url(#icon)" href="data:image/png;base64,"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" fill="none" stroke="#29292c" stroke-width="1.5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="292" y="151" fill="#f4f0e8" font-size="64" font-weight="700" letter-spacing="-2">Mello <tspan fill="#ffffff">TV</tspan></text>
    <text x="295" y="198" fill="#d0ced0" font-size="23">Movies and TV on your own server.</text>
    <text x="295" y="239" fill="#8e8e93" font-size="15" letter-spacing="0.3">macOS · iOS · Web · Docker</text>
  </g>
</svg>
